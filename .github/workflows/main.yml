name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ main ] # Triggers automatically on push to main
  workflow_dispatch:   # Allows you to click a "Run workflow" button manually

# Required to allow the action to push the built code to the gh-pages branch
permissions:
  contents: write

# Cancels any ongoing previous builds if you push new code quickly
concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # A solid, modern LTS version
          cache: 'npm'       # Speeds up runs by caching node_modules

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Project
        # The dynamic variable ${{ github.event.repository.name }} ensures the base-href 
        # is always perfectly matched to your GitHub URL, even if you rename the repo later!
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          
          # UPDATE THIS LINE: Point to your angular.json "outputPath"
          # Angular 17+ defaults to: ./dist/<project-name>/browser
          # Older Angular defaults to: ./dist/<project-name>
          publish_dir: ./dist/test/browser 
          
          # Keeps your gh-pages branch clean by wiping old history
          force_orphan: true
